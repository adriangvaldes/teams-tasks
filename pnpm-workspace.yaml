packages:
  - 'apps/*'
  - 'packages/*'

# O Metro (React Native) nao resolve a arvore de symlinks isolada do pnpm: um
# pacote como `expo` nao consegue enxergar as proprias dependencias
# (expo-modules-core) porque elas ficam sob node_modules/.pnpm. O linker
# hoisted produz um node_modules plano, que o Metro entende.
#
# ATENCAO: no pnpm 11 esta configuracao mora AQUI, e nao no .npmrc.
nodeLinker: hoisted

# O pnpm 11 bloqueia postinstall de dependencias por padrao e, sem esta
# declaracao, `pnpm install` SAI COM CODIGO 1 - o que quebraria o primeiro
# passo do README.
#
# O nome da chave importa: no pnpm 11 e `allowBuilds` (mapa pacote -> booleano).
# `onlyBuiltDependencies` (lista) era o formato do pnpm 10 e e silenciosamente
# ignorado aqui. Declarar explicitamente tambem o que NAO deve ser construido
# evita o prompt interativo do `pnpm approve-builds` no CI.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # Resolver nativo opcional de tooling: nao e necessario e compilar em
  # Windows/Alpine so adiciona risco.
  unrs-resolver: false

# O pnpm 11 poe em quarentena pacotes publicados nas ultimas ~24h (protecao de
# supply chain). O Expo publica patches de SDK quase diariamente, entao instalar
# o SDK 57 atual seria bloqueado. Em vez de desligar a politica para tudo, a
# excecao fica restrita ao ecossistema Expo/React Native.
minimumReleaseAgeExclude:
  - expo
  - '@expo/*'
  - 'expo-*'
  - '@react-native/*'
  - 'react-native'
  - 'react-native-*'
